########################################
# Trembita Games Vanilla RDR2 with Server Data
# Generated by txAdmin recipe
########################################

########################################
# Game
########################################

set gamename rdr3

########################################
# Network
########################################

{{serverEndpoints}}

sv_maxclients {{maxClients}}

set onesync on

########################################
# Server Information
########################################

sv_hostname "{{serverName}}"

sets sv_projectName "Trembita Games RDR2 Server"
sets sv_projectDesc "RDR2 server deployed with txAdmin and Trembita Games server data"

########################################
# Resources
########################################

ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager-rdr3
ensure basic-gamemode
ensure hardcap
ensure rconlog

# Future Trembita Games resources:
# ensure tg-world-loader

########################################
# Security
########################################

sv_scriptHookAllowed 0

########################################
# Permissions
########################################

exec permissions.cfg

########################################
# Tags
########################################

sets tags "rdr2,redm,trembita,ukraine,server-data"

########################################
# Locale
########################################

sets locale "uk-UA"

########################################
# License
########################################

{{svLicense}}

########################################
# Admins
########################################

{{addPrincipalsMaster}}