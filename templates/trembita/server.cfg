########################################
# Trembita Games RDR2 Server
# Generated by txAdmin recipe
########################################

########################################
# Game
########################################

set gamename rdr3

########################################
# Network
########################################

# Generated by txAdmin.
{{serverEndpoints}}

sv_maxclients {{maxClients}}

# OneSync is configured by txAdmin through the recipe metadata.
# See `$onesync: on` in the recipe file.

########################################
# Server Information
########################################

sv_hostname "{{serverName}}"

sets sv_projectName "Trembita Games RDR2 Server"
sets sv_projectDesc "RDR2 server deployed with txAdmin and Trembita Games server data"

# Loading a server icon requires a 96x96 PNG file in the server root.
# load_server_icon server-icon.png

# Set an optional server info and connecting banner image url.
# Size does not matter, any banner-sized image should work.
# sets banner_detail "https://url.to/image.png"
# sets banner_connecting "https://url.to/image.png"

########################################
# Tags
########################################

sets tags "rdr2,redm,trembita,ukraine,server-data"

########################################
# Locale
########################################

sets locale "uk-UA"

########################################
# Resources
########################################

exec resources.cfg
exec trembita-resources.cfg

########################################
# Security
########################################

# Allows players to use scripthook-based plugins when set to 1.
sv_scriptHookAllowed 0

########################################
# Permissions
########################################

exec permissions.cfg

########################################
# Secrets
########################################

# Generated by txAdmin recipe.
# Contains sv_licenseKey and optional steam_webApiKey.
exec secrets.cfg

########################################
# Admins
########################################

{{addPrincipalsMaster}}

########################################
# Optional
########################################

# set rcon_password "CHANGE_ME"
# sv_enforceGameBuild 1491
# sv_master1 ""
