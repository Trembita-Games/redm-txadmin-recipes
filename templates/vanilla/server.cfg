########################################
# Trembita Games Vanilla RDR2
# Generated by txAdmin recipe
########################################

########################################
# Game
########################################

set gamename rdr3

########################################
# Network
########################################

{{serverEndpoints}}

sv_maxclients {{maxClients}}

set onesync on

########################################
# Server Information
########################################

sv_hostname "{{serverName}}"

sets sv_projectName "Trembita Games RDR2 Vanilla"
sets sv_projectDesc "Vanilla-first RDR2 server deployed with txAdmin"

# load_server_icon server-icon.png

########################################
# Resources
########################################

ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager-rdr3
ensure basic-gamemode
ensure hardcap
ensure rconlog

########################################
# Security
########################################

sv_scriptHookAllowed 0

########################################
# Permissions
########################################

exec permissions.cfg

########################################
# Secrets
########################################

exec secrets.cfg

########################################
# Tags
########################################

sets tags "vanilla,rdr2,redm,trembita,ukraine"

########################################
# Locale
########################################

sets locale "uk-UA"

########################################
# Admins
########################################

{{addPrincipalsMaster}}

########################################
# Optional
########################################

# set rcon_password "CHANGE_ME"
# sv_master1 ""