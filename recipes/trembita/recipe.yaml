# Trembita Games RedM/RDR2 txAdmin Recipe
#
# References:
# - https://github.com/tabarra/txAdmin/blob/master/docs/recipe.md
# - https://github.com/citizenfx/txAdmin-recipes
#
# Purpose:
# Deploy a Trembita Games RedM/RDR2 server through txAdmin using
# default Cfx.re resources plus curated Trembita Games server data.

$engine: 3
$onesync: on
$steamRequired: false

name: Trembita-RDR2
version: v0.1.9
author: Trembita Games
description: Trembita Games RedM/RDR2 txAdmin recipe with curated server data

variables:
  steam_webApiKey: ""

tasks:
  # Download this recipe repository to access templates.
  - action: download_github
    src: https://github.com/Trembita-Games/redm-txadmin-recipes
    ref: v0.1.9
    dest: ./temp/redm-txadmin-recipes

  # Download default Cfx.re server data resources.
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/

  # Download Trembita Games curated server data resources.
  - action: download_github
    src: https://github.com/Trembita-Games/redm-server-data
    ref: v0.2.0
    subpath: resources
    dest: ./temp/redm-server-data-resources

  # Overlay all Trembita resource groups on top of the base Cfx.re resources.
  - action: copy_path
    src: ./temp/redm-server-data-resources
    dest: ./resources

  # Move recipe-specific configuration templates to the server root.
  - action: move_path
    src: ./temp/redm-txadmin-recipes/templates/trembita/server.cfg
    dest: ./server.cfg
    
  - action: move_path
    src: ./temp/redm-txadmin-recipes/templates/common/resources.cfg
    dest: ./resources.cfg

  - action: move_path
    src: ./temp/redm-txadmin-recipes/templates/trembita/resources.cfg
    dest: ./trembita-resources.cfg

  - action: move_path
    src: ./temp/redm-txadmin-recipes/templates/common/permissions.cfg
    dest: ./permissions.cfg

  - action: move_path
    src: ./temp/redm-txadmin-recipes/templates/common/secrets.cfg
    dest: ./secrets.cfg

  # Replace recipe variables inside the generated secrets file.
  - action: replace_string
    mode: all_vars
    file: ./secrets.cfg

  # Clean up temporary files.
  - action: remove_path
    path: ./temp
