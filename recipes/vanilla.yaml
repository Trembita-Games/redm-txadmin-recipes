# Trembita Games RedM/RDR2 Vanilla txAdmin Recipe
#
# Status:
# Initial draft / not fully validated yet.
#
# Purpose:
# Deploy a minimal vanilla-first RedM/RDR2 server through txAdmin.

$engine: 3
$name: Trembita Games Vanilla RDR2
$version: 0.1.0
$author: Trembita Games
$description: Minimal vanilla-first RedM/RDR2 server deployment recipe.

tasks:
  # This recipe is intentionally kept as a first draft.
  # It should be validated against txAdmin before being marked as stable.

  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    dest: ./tmp/cfx-server-data

  - action: move_path
    src: ./tmp/cfx-server-data/resources
    dest: ./resources

  - action: remove_path
    path: ./tmp

  - action: write_file
    file: ./server.cfg
    template: ../../templates/vanilla/server.cfg

  - action: write_file
    file: ./permissions.cfg
    template: ../../templates/vanilla/permissions.cfg